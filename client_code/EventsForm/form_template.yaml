      content: |-
        Questo è il calendario dei prossimi lavori nelle sedi, in particolare nella sede To1.

        Come sapete la Sezione CNGEI Torino ha vinto un bando per l'assegnazione dei locali di Via De Canal 33bis/A, ma questa assegnazione comporta anche una serie di oneri, tra i quali una sostanziale ristrutturazione 🛠 .
        I soci del Clan (adulti della Sezione non impegnati in attività con i ragazzi/e) sono già attivi da mesi nei lavori 🪚, e con loro alcuni genitori 🧹, ma gli sforzi non sono sufficienti per rispettare la tabella di marcia.

        C'è ancora bisogno dell'aiuto di tutti! Fermatevi a parlare con capi o dirigenti per avere più informazioni.
