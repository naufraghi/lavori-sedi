allow_embedding: false
db_schema:
  events:
    client: none
    columns:
    - admin_ui: {width: 200}
      name: title
      type: string
    - admin_ui: {order: 2, width: 200}
      name: start_datetime
      type: datetime
    - admin_ui: {order: 3, width: 200}
      name: end_datetime
      type: datetime
    - admin_ui: {width: 200}
      name: description
      type: string
    - admin_ui: {width: 200}
      name: location
      type: string
    - admin_ui: {width: 200}
      name: participants
      target: participants
      type: link_multiple
    - admin_ui: {width: 200}
      name: archived
      type: bool
    server: full
    title: Events
  participants:
    client: none
    columns:
    - admin_ui: {width: 200}
      name: name
      type: string
    - admin_ui: {width: 200}
      name: email
      type: string
    - admin_ui: {width: 200}
      name: event
      target: events
      type: link_single
    - admin_ui: {order: 3, width: 200}
      name: role
      type: string
    server: full
    title: Participants
